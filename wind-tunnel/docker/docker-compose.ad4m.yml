# Sovereign wind-tunnel — ad4m lane overlay.
#
# Layered on top of docker-compose.yml to add the AD4M executor path:
#
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.ad4m.yml up -d
#
# Two agents on one multi-user executor, the way WE's staging node hosts its
# users:
#
#   - "Hex": the user Sovereign's waker connects as (its JWT is Sovereign's
#     ad4m token). It publishes the channel perspective as a neighbourhood
#     over the server-link-language, which syncs through `link-server`
#     (Holochain is off, as on WE's staging).
#   - "Alex": a second user with its own DID, standing in for a WE user. It
#     joins the neighbourhood by URL. On one executor a joined neighbourhood
#     is the same perspective with a second owner, so every link Alex writes is
#     signed by Alex's key and lands in the perspective Hex's waker watches.
#
# `ad4m-provision` signs both up, publishes and joins BEFORE Sovereign boots
# and writes the manifest s10 (on the host) drives both agents from.
#
# The executor image is built from an ad4m checkout by
# ad4m/build-exec-image.sh (AD4M_EXEC_IMAGE, default swt-ad4m-exec:latest).
# The provision step loads the @coasys/ad4m SDK from the vendored submodule's
# build (vendor/coasys/ad4m/core/lib, made by `pnpm run build`).

services:
  link-server:
    build:
      context: ../../vendor/coasys/ad4m/link-server
    image: swt-link-server:latest
    environment:
      PORT: "3456"
      AUTO_ADMIT: "true"
    networks:
      - default

  ad4m:
    image: ${AD4M_EXEC_IMAGE:-swt-ad4m-exec:latest}
    depends_on:
      link-server:
        condition: service_started
    environment:
      ADMIN_CREDENTIAL: "windtunnel-admin"
      ENABLE_MULTI_USER: "true"
      ENABLE_MCP: "true"
      MCP_PORT: "3001"
      RUN_HOLOCHAIN: "false"
      AGENT_PASSPHRASE: "windtunnel-pass"
    ports:
      # MCP and WS-RPC, exposed to the host so s10 can act as both agents.
      - "14561:3001"
      - "14560:12000"
    # Sovereign sits only on the `windtunnel` network (base compose); the
    # provision step and the link-server use the default one. Without both,
    # `ad4m` does not even resolve from Sovereign.
    networks:
      - default
      - windtunnel

  ad4m-provision:
    image: node:22-bookworm-slim
    depends_on:
      ad4m:
        condition: service_started
    volumes:
      - ../ad4m:/scripts:ro
      - ../ad4m/.provision:/out
      - ../../vendor/coasys/ad4m/core/lib:/sdk:ro
    environment:
      ADMIN_CREDENTIAL: "windtunnel-admin"
      AD4M_EMAIL: "sovereign-wt@agent.local"
      AD4M_PASSWORD: "sovereign-wt-pass-123"
      AD4M_USER_EMAIL: "alex-wt@agent.local"
      AD4M_USER_PASSWORD: "alex-wt-pass-123"
      AD4M_CHANNEL: "swt-ad4m://channel"
      AD4M_WS_URL: "http://ad4m:12000"
      LINK_SERVER_URL: "http://link-server:3456"
      SERVER_LINK_BUNDLE: "/opt/ad4m/server-link-language/bundle.js"
      AD4M_SDK: "/sdk/index.js"
    command: ["node", "/scripts/provision.mjs", "http://ad4m:3001", "/out"]
    restart: "no"

  sovereign:
    depends_on:
      mock-llm:
        condition: service_healthy
      ad4m-provision:
        condition: service_completed_successfully
    volumes:
      # ad4m-lane config (ad4m.host + agentName Hex) over the baked default,
      # and the provisioned token dir as the data dir so the waker boots with it.
      - ../ad4m/config.json:/data/config/config.json:ro
      - ../ad4m/.provision:/data/data
