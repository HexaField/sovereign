# LiteLLM proxy configuration — Arcadia (primary machine)
#
# Routes Anthropic Messages API requests from Sovereign's claude-code backend
# to local inference backends by model name. This proxy ONLY handles sessions
# using non-Claude models — Claude sessions bypass it entirely and continue
# using their normal OAuth auth to api.anthropic.com.
#
# Sovereign injects ANTHROPIC_BASE_URL=http://localhost:4000 into the SDK
# subprocess ONLY when the session model is unrecognised by familyForModel
# (i.e. not a claude-* model). Claude threads retain their existing auth flow.
#
# This proxy sits at :4000, Anthropic-compat endpoint at /v1/messages.
# llama-server (OpenAI compat) runs at :9090.
#
# Usage:
#   litellm --config services/litellm/litellm.yaml --port 4000
#   # or via systemd: systemctl --user start litellm

model_list:
  # ── Local inference (Qwen via llama-server on :9090) ───────────────────
  # Model names here are what Sovereign threads are configured to use.
  # litellm_params.model must use openai/ prefix for OpenAI-compat backends.
  #
  # use_responses_api: false — CRITICAL. Prevents LiteLLM from routing to
  # /v1/responses when the incoming request contains thinking/reasoning params.
  # Without this, LiteLLM translates Anthropic thinking → reasoning_effort:
  # "high", which llama-server's Jinja template rejects (only xhigh/medium/low
  # are valid). Forcing chat/completions routes avoids this entirely.

  # Currently serving: Qwen3.6-35B-A3B ROCmFP4-STRIX (llama-server-rocmfpx.service)
  # ~53-65 t/s with MTP. Model name kept as qwen3.8-27b for routing continuity.
  # chat_template_kwargs.enable_thinking=false: disables Qwen3 thinking blocks at
  # the Jinja template level (correct method; --reasoning off breaks generation).
  - model_name: "qwen3.8-27b"
    litellm_params:
      model: "openai/qwen3.8-27b"
      api_base: "http://localhost:9090/v1"
      api_key: "unused"
      use_responses_api: false
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
    model_info:
      mode: "chat"
      supports_function_calling: true
      supports_extended_thinking: false
      max_input_tokens: 200000
      max_output_tokens: 8192

  # Bare alias — threads can set model: qwen for the current local default
  - model_name: "qwen"
    litellm_params:
      model: "openai/qwen3.8-27b"
      api_base: "http://localhost:9090/v1"
      api_key: "unused"
      use_responses_api: false
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
    model_info:
      mode: "chat"
      supports_function_calling: true
      supports_extended_thinking: false
      max_input_tokens: 200000
      max_output_tokens: 8192

  # ── Gemma 4 26B-A4B QAT — target subagent model ────────────────────────
  # Strix Halo: ~110 t/s with matched QAT MTP head (SleepingRobots benchmark).
  # GGUF: unsloth/gemma-4-26B-A4B-it-qat-GGUF (UD-Q4_K_XL) + separate Q4_0 MTP head.
  # Enable once the model is loaded into llama-server (currently serving qwen3.8-27b).
  # Update llama-server service file to point at Gemma 4 GGUF, then uncomment below.
  # - model_name: "gemma4-26b"
  #   litellm_params:
  #     model: "openai/gemma-4-26b-it-qat"
  #     api_base: "http://localhost:9090/v1"
  #     api_key: "unused"
  #     use_responses_api: false
  #   model_info:
  #     mode: "chat"
  #     supports_function_calling: true
  #     supports_extended_thinking: false

  # ── Qwen3.6-35B-A3B ROCmFP4 — fallback option ──────────────────────────
  # Strix Halo: ~86-101 t/s with MTP (plunderstruck/Qwen3.6-35B-A3B-MTP-ROCmFP4-GGUF).
  # Dropped previously for quality reasons (MoE 3B active too weak for subagents).
  # Uncomment to test alongside Gemma 4 once either model is loaded.
  # - model_name: "qwen3.6-35b"
  #   litellm_params:
  #     model: "openai/Qwen3.6-35B-A3B-Q4_K_M"
  #     api_base: "http://localhost:9090/v1"
  #     api_key: "unused"
  #     use_responses_api: false
  #   model_info:
  #     mode: "chat"
  #     supports_function_calling: true
  #     supports_extended_thinking: false

  # Mac Studio M5 Ultra — add entries here when it arrives (1.2TB/s)

litellm_settings:
  # Drop unsupported params rather than erroring — needed when the SDK sends
  # Anthropic-specific fields that the OpenAI-compat backends don't accept.
  drop_params: true
  # Master key: Sovereign's SDK subprocess authenticates to this proxy using
  # ANTHROPIC_API_KEY=litellm. Since Claude sessions never reach this proxy
  # (Sovereign only injects env vars for non-Claude models), there is no need
  # to forward a real Anthropic key from here.
  master_key: "litellm"
  # Log level: INFO in production, DEBUG for troubleshooting.
  set_verbose: false
  # CRITICAL: Force chat/completions routing for all providers including openai/*.
  # Without this, LiteLLM routes openai/* models through the Responses API
  # (/v1/responses), which translates Anthropic thinking→reasoning_effort:"high".
  # llama-server's Jinja template rejects "high" (only xhigh/medium/low valid).
  # Chat/completions avoids the Responses API entirely.
  use_chat_completions_url_for_anthropic_messages: true
